<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Framer sticky iframe test</title>
    <style>
      body {
        margin: 0;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        color: #1c1c1c;
        background:
          radial-gradient(1200px 600px at 20% -10%, #d9e7ff 0%, transparent 55%),
          radial-gradient(900px 500px at 90% 10%, #ffe7d6 0%, transparent 50%),
          linear-gradient(180deg, #f7f4ef 0%, #ebe4d8 100%);
      }
      /* Fixed 240px sticky embed — never resizes, so page content never jumps. */
      #blake-embed-wrap {
        position: sticky;
        top: 0;
        z-index: 50;
        width: 100%;
        height: 240px;
        margin: 0;
        pointer-events: none;
      }
      #blake-embed {
        display: block;
        width: 100%;
        height: 240px;
        border: 0;
        background: transparent;
        pointer-events: auto;
      }
      main {
        max-width: 42rem;
        margin: -168px auto 0; /* pull content up under transparent iframe area */
        padding: 0 1.25rem 8rem;
        position: relative;
        z-index: 0;
      }
      h1 {
        font-size: 3rem;
        letter-spacing: -0.04em;
        line-height: 0.95;
        margin-top: 5.5rem; /* clear the visible pill row */
      }
      .block {
        height: 70vh;
        margin: 2rem 0;
        border-radius: 1.25rem;
        background: linear-gradient(135deg, #2b2f36, #6b5b4b);
        color: #f6f1ea;
        display: grid;
        place-items: end start;
        padding: 1.5rem;
      }
      #probe {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 60;
        background: #111;
        color: #fff;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        font: 12px/1.3 ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <div id="blake-embed-wrap">
      <iframe
        id="blake-embed"
        title="Blake nav embed"
        src="/embed"
        allow="autoplay"
      ></iframe>
    </div>
    <main>
      <h1>Scroll under sticky embed</h1>
      <p>
        Fixed 240px iframe — expand must not change wrap height or shift this
        page. Soft shadows only (no clipped drop shadow).
      </p>
      <div class="block">Section A</div>
      <div class="block">Section B</div>
      <div class="block">Section C</div>
    </main>
    <div id="probe">wrap: —</div>
    <script>
      const wrap = document.getElementById("blake-embed-wrap");
      const probe = document.getElementById("probe");
      const startH = wrap.getBoundingClientRect().height;
      const tick = () => {
        const h = wrap.getBoundingClientRect().height;
        probe.textContent =
          "wrap: " + Math.round(h) + "px" + (h === startH ? " (stable)" : " MOVED");
      };
      tick();
      setInterval(tick, 200);
    </script>
  </body>
</html>
