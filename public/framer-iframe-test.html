<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No-crush short embed test</title>
    <style>
      body {
        margin: 0;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        color: #1c1c1c;
        background: linear-gradient(180deg, #f7f4ef 0%, #ebe4d8 100%);
      }
      #blake-spacer {
        height: 72px;
        width: 100%;
        pointer-events: none;
      }
      #blake-embed-wrap {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 72px;
        z-index: 9999;
        overflow: visible;
      }
      #blake-embed {
        display: block;
        width: 100%;
        height: 72px;
        border: 0;
        background: transparent;
        overflow: visible;
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 8rem;
      }
      h1 {
        font-size: 3rem;
        letter-spacing: -0.04em;
        line-height: 0.95;
      }
      .block {
        height: 70vh;
        margin: 2rem 0;
        border-radius: 1.25rem;
        background: linear-gradient(135deg, #2b2f36, #6b5b4b);
        color: #f6f1ea;
        display: grid;
        place-items: end start;
        padding: 1.5rem;
      }
      #probe {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 10000;
        background: #111;
        color: #fff;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        font: 12px/1.35 ui-monospace, monospace;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="blake-spacer"></div>
    <div id="blake-embed-wrap">
      <iframe id="blake-embed" title="Blake nav" src="/embed" allow="autoplay"></iframe>
    </div>
    <main>
      <h1 id="headline">No crush / no jump</h1>
      <p>Document stays 72px. Overlay grows. Pills must stay full size.</p>
      <div class="block">Section A</div>
      <div class="block">Section B</div>
    </main>
    <div id="probe">…</div>
    <script>
      const spacer = document.getElementById("blake-spacer");
      const wrap = document.getElementById("blake-embed-wrap");
      const iframe = document.getElementById("blake-embed");
      const probe = document.getElementById("probe");
      const headline = document.getElementById("headline");
      const startH1 = headline.getBoundingClientRect().top;

      window.addEventListener("message", (event) => {
        const data = event.data;
        if (!data || data.type !== "blake-embed-height") return;
        const h = Math.max(72, Number(data.height) || 72);
        iframe.style.height = h + "px";
        wrap.style.height = h + "px";
      });

      setInterval(() => {
        const doc = iframe.contentDocument;
        const pn = doc && doc.querySelector(".pn");
        const html = doc && doc.documentElement;
        const pnH = pn ? pn.getBoundingClientRect().height : 0;
        const htmlH = html ? parseFloat(getComputedStyle(html).height) : 0;
        const pageMoved =
          Math.abs(headline.getBoundingClientRect().top - startH1) > 1;
        probe.textContent =
          "doc: " +
          Math.round(htmlH) +
          "px\n" +
          "pill: " +
          Math.round(pnH) +
          "px\n" +
          "overlay: " +
          Math.round(wrap.getBoundingClientRect().height) +
          "px\n" +
          "page: " +
          (pageMoved ? "MOVED" : "stable") +
          (pnH > 0 && pnH < 40 ? "\nCRUSHED" : "");
      }, 150);
    </script>
  </body>
</html>
