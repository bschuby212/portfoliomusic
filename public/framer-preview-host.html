<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Framer preview host — nested srcdoc overlay</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f4f1ea;
        color: #212324;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #framer-chrome {
        position: sticky;
        top: 0;
        z-index: 1;
        height: 40px;
        background: #8b5cf6;
        color: #fff;
        display: flex;
        align-items: center;
        padding: 0 1rem;
        font: 600 13px/1 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.02em;
      }
      #page {
        max-width: 44rem;
        margin: 0 auto;
        padding: 5.5rem 1.25rem 90vh;
      }
      .marker {
        min-height: 55vh;
        margin: 2rem 0;
        padding: 1.5rem;
        border-radius: 1.25rem;
        background: #2b2f36;
        color: #f6f1ea;
      }
    </style>
  </head>
  <body>
    <div id="framer-chrome">FRAMER PREVIEW CHROME — must not remain after About / Why I’m looking</div>
    <div style="height: 72px; width: 100%; pointer-events: none"></div>
    <div
      id="blake-embed-wrap"
      style="
        position: fixed;
        top: 40px;
        left: 0;
        right: 0;
        height: 72px;
        z-index: 9999;
        overflow: hidden;
      "
    >
      <iframe
        id="framer-srcdoc"
        title="Framer HTML embed"
        style="display: block; width: 100%; height: 72px; border: 0; background: transparent"
        srcdoc="<!doctype html><html><head><style>html,body{margin:0;padding:0;overflow:hidden;background:transparent}</style></head><body><iframe id='blake-embed' src='/embed' title='Blake nav' style='display:block;width:100%;height:72px;border:0;background:transparent' allow='autoplay; encrypted-media; clipboard-write'></iframe><script>window.addEventListener('message',function(event){var data=event.data;if(!data||data.type!=='blake-embed-height')return;var iframe=document.getElementById('blake-embed');var h=Math.max(72,Number(data.height)||72);if(iframe)iframe.style.height=h+'px';document.body.style.height=h+'px';window.parent.postMessage({type:'blake-embed-height',height:h},'*');});</script></body></html>"
      ></iframe>
    </div>
    <script>
      const wrap = document.getElementById("blake-embed-wrap");
      const srcdocFrame = document.getElementById("framer-srcdoc");
      window.addEventListener("message", (event) => {
        if (!event.data || event.data.type !== "blake-embed-height") return;
        const h = Math.max(72, Number(event.data.height) || 72);
        srcdocFrame.style.height = h + "px";
        wrap.style.height = h + "px";
      });
    </script>
    <main id="page">
      <h1>Home (Framer page)</h1>
      <p>
        Destinations must replace this tab. About and Why I’m looking must not
        open inside the 72px overlay or leave this purple chrome on screen.
      </p>
      <div class="marker" id="new-home-hmm-real">Work section</div>
      <div class="marker" id="new-home-playground">Playground section</div>
    </main>
  </body>
</html>
