[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

# Audio files are public; API CORS is handled in route handlers.
[[headers]]
  for = "/audio/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

# Allow Framer / Netlify parents to iframe the nav-only embed.
[[headers]]
  for = "/embed"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"
    # Omit X-Frame-Options so CSP frame-ancestors controls embedding.
    # Tip for parents: iframe { overflow: visible } + height ~420px so expand isn't clipped by the frame box.

[[headers]]
  for = "/embed/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"
