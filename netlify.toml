[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

# Audio files are public; API CORS is handled in route handlers.
[[headers]]
  for = "/audio/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

# Allow Framer Website/Embed (URL-only) to iframe the nav.
# Also set in next.config.ts — both keep framing open after Netlify+Next deploy.
[[headers]]
  for = "/embed"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"

[[headers]]
  for = "/embed/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"
